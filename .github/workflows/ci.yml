name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同じ ref の古い実行はキャンセルする
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    # 結合テスト用の CouchDB 3
    services:
      couchdb:
        image: couchdb:3
        env:
          COUCHDB_USER: admin
          COUCHDB_PASSWORD: password
        ports:
          - 5984:5984
        options: >-
          --health-cmd "curl -fsS http://localhost:5984/_up"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COUCHDB_TEST_URL: http://admin:password@localhost:5984
    steps:
      - uses: actions/checkout@v7

      # CouchDB 3 のシングルノードにはシステム DB が必要 (既存なら 412 を無視)
      - name: CouchDB システム DB を作成
        working-directory: .
        run: |
          for db in _users _replicator _global_changes; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X PUT "$COUCHDB_TEST_URL/$db")
            echo "$db -> $code"
            case "$code" in 201|202|412) ;; *) exit 1 ;; esac
          done

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Dockerfile と同じ pnpm バージョンを corepack で有効化
      - name: pnpm を有効化
        run: |
          corepack enable
          corepack prepare pnpm@12.8.1 --activate

      - name: pnpm store のパスを取得
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('server/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # SDK platform 36 / build-tools 36.1.0 を用意し、ライセンスも非対話で承認
      - uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-36 build-tools;36.1.0

      - uses: gradle/actions/setup-gradle@v6

      - name: ユニットテストとデバッグビルド
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      # APK は保存しない（依存ライブラリのライセンス表示なしでの配布になるのを避ける）
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/test-results/
          if-no-files-found: warn
          retention-days: 7
