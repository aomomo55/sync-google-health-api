name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同じ ref の古い実行はキャンセルする
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    # 結合テスト用の CouchDB 3
    services:
      couchdb:
        image: couchdb:3
        env:
          COUCHDB_USER: admin
          COUCHDB_PASSWORD: password
        ports:
          - 5984:5984
        options: >-
          --health-cmd "curl -fsS http://localhost:5984/_up"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COUCHDB_TEST_URL: http://admin:password@localhost:5984
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # CouchDB 3 のシングルノードにはシステム DB が必要 (既存なら 412 を無視)
      - name: CouchDB システム DB を作成
        working-directory: .
        run: |
          for db in _users _replicator _global_changes; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X PUT "$COUCHDB_TEST_URL/$db")
            echo "$db -> $code"
            case "$code" in 201|202|412) ;; *) exit 1 ;; esac
          done

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # server/package.json の packageManager の版を sha512 を検査して入れる
      # (corepack prepare はハッシュを検査せずにキャッシュするので使わない)
      # corepack は Node 25 以降に同梱されないため npm で固定版を入れる。版は server/Dockerfile の COREPACK_VERSION と audit.yml と合わせる
      - name: pnpm を有効化
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          npm install -g corepack@0.36.0
          corepack enable
          corepack install
          pnpm --version

      - name: pnpm store のパスを取得
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('server/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # 本番と同じ Dockerfile でイメージが作れるかを確かめる（push はしない）
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: server
          push: false
          cache-from: type=gha
          # Dependabot の PR などでキャッシュに書けなくてもビルドは失敗させない
          cache-to: type=gha,mode=max,ignore-error=true

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      # SDK platform 36 / build-tools 36.1.0 を用意し、ライセンスも非対話で承認
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platforms;android-36 build-tools;36.1.0

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: ユニットテストとデバッグビルド
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      # APK は保存しない（依存ライブラリのライセンス表示なしでの配布になるのを避ける）
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: unit-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/test-results/
          if-no-files-found: warn
          retention-days: 7
