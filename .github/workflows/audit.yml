name: Audit

# server の本番の依存に、既知の脆弱性（high 以上）が無いかを確かめる。
# 依存を変えていなくても脆弱性は後から公開されるので、週に一度も実行する
on:
  schedule:
    # 毎週月曜 21:17（UTC。日本時間では火曜 6:17）
    - cron: "17 21 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - server/package.json
      - server/pnpm-lock.yaml

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # pnpm の入れ方は ci.yml と同じ。版は server/Dockerfile の COREPACK_VERSION と ci.yml に合わせる
      - name: pnpm を有効化
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          npm install -g corepack@0.36.0
          corepack enable
          corepack install
          pnpm --version

      # pnpm audit は pnpm-lock.yaml を読むので、依存のインストールは要らない
      - run: pnpm audit --prod --audit-level=high
