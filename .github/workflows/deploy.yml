name: Deploy

# 手で起動したときだけ、main のサーバーを fly.io にデプロイする（理由は docs/adr/0029-deploy-from-actions-on-demand.md）
# 起動: Actions の画面の「Run workflow」か `gh workflow run deploy.yml --ref main`
on:
  workflow_dispatch:

permissions:
  contents: read

# デプロイは途中で止めずに、順に 1 つずつ動かす
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # FLY_API_TOKEN と FLY_APP は production 環境の secrets。main からの実行だけが読める
    # FLY_APP も secrets に置くのは、公開されるログでアプリ名を伏せるため
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 版を固定し、sha256 を検査して入れる。版を上げるときは公開から 3 日以上たったものにし、
      # リリースの flyctl_<版>_checksums.txt の Linux_x86_64.tar.gz の値に書き換える
      - name: flyctl を入れる
        env:
          FLYCTL_VERSION: 0.4.120
          FLYCTL_SHA256: ef9b938ff3af2b28fad961a676e5ac2295124ad0b892ffb1c5f16a03bd4ee378
        run: |
          archive="$RUNNER_TEMP/flyctl.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/superfly/flyctl/releases/download/v${FLYCTL_VERSION}/flyctl_${FLYCTL_VERSION}_Linux_x86_64.tar.gz"
          echo "${FLYCTL_SHA256}  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/flyctl"
          tar -xzf "$archive" -C "$RUNNER_TEMP/flyctl" flyctl
          echo "$RUNNER_TEMP/flyctl" >> "$GITHUB_PATH"

      # イメージは fly.io のビルダーで作る（依存のインストールがトークンのある場所で動かないように）
      - name: デプロイ
        working-directory: server
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: ${{ secrets.FLY_APP }}
        run: flyctl deploy -a "$FLY_APP" --remote-only --ha=false

      # 止まっているマシンは最初のリクエストで起動するので、何度か待つ
      - name: /healthz を確かめる
        env:
          FLY_APP: ${{ secrets.FLY_APP }}
        run: curl -fsS --retry 6 --retry-delay 10 --retry-all-errors "https://${FLY_APP}.fly.dev/healthz"
