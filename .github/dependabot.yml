# 依存の更新を月に一度まとめて提案する。マイナー・パッチはエコシステムごとに 1 つの PR にまとめる
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      github-actions-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    # Node のメジャー更新は LTS の時期に合わせて手動で行う（奇数版や LTS 前の版を提案させない）
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
    groups:
      docker-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    # 型定義は実行環境の Node のメジャーに合わせる
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      gradle-minor-patch:
        update-types:
          - minor
          - patch
