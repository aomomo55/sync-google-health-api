# fly.io の設定。アプリ名はプレースホルダーのままにし、本番のアプリ名はコミットしない
# 手元からは `fly deploy -a <アプリ名>` で、GitHub Actions では secrets の FLY_APP で指定する（docs/deploy.md）
app = "your-app-name"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  COUCHDB_HEALTH_DB = "health"
  VAULT_HEALTH_PREFIX = "Health/"

[http_service]
  internal_port = 8080
  force_https = true
  # 使われていないときは停止し、リクエストが来たら起動する
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
